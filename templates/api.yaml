apiVersion: v1
kind: ServiceAccount
metadata:
  name: databridge-contributor-service
  {{- with .Values.storage.serviceAccountRoleArn }}
  annotations:
    eks.amazonaws.com/role-arn: {{ . | quote }}
  {{- end }}
---
{{- $services := dict "contributor" .Values.contributorService "analytics" .Values.analyticsService }}
{{- range $name, $config := $services }}
{{- $port := ternary 8081 8082 (eq $name "contributor") }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "databridge.fullname" $ }}-{{ $name }}-service
spec:
  replicas: {{ $config.replicaCount }}
  selector:
    matchLabels: { app: databridge-{{ $name }}-service }
  template:
    metadata:
      labels: { app: databridge-{{ $name }}-service }
    spec:
      {{- if eq $name "contributor" }}
      serviceAccountName: databridge-contributor-service
      {{- end }}
      containers:
        - name: service
          image: "{{ $config.image.repository }}:{{ $config.image.tag }}"
          imagePullPolicy: {{ $config.image.pullPolicy }}
          ports: [{ containerPort: {{ $port }} }]
          env:
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: {{ $.Values.postgres.existingSecret }}, key: {{ $.Values.postgres.userKey }} } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ $.Values.postgres.existingSecret }}, key: {{ $.Values.postgres.passwordKey }} } }
            - name: DATABASE_URL
              value: "postgresql+psycopg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@{{ $.Values.postgres.host }}:{{ $.Values.postgres.port }}/{{ $.Values.postgres.database }}"
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: {{ $config.jwtSecretExistingSecret }}, key: jwt-secret } }
            - name: PORT
              value: {{ $port | quote }}
            {{- if eq $name "contributor" }}
            - name: UPLOAD_BUCKET
              value: {{ $.Values.storage.bucket | quote }}
            - name: DELIVERABLE_BUCKET
              value: {{ $.Values.storage.deliverableBucket | quote }}
            - name: S3_REGION
              value: {{ $.Values.storage.region | quote }}
            {{- end }}
          readinessProbe:
            httpGet: { path: /health, port: {{ $port }} }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: {{ $port }} }
            initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "databridge.fullname" $ }}-{{ $name }}-service
spec:
  selector: { app: databridge-{{ $name }}-service }
  ports:
    - port: {{ $config.service.port }}
      targetPort: {{ $port }}
{{- end }}
